<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Flinki – App-Icons</title>
<style>
body{font:16px system-ui,sans-serif;background:#10233a;color:#fff;padding:20px}
figure{display:inline-block;margin:10px;text-align:center}
canvas{background:#000;border-radius:12px;max-width:256px}
a{color:#ffe066}
</style>
</head>
<body>
<h1>App-Icons für Flinki</h1>
<p>Die Icons werden hier gezeichnet. Mit einem Klick auf «PNG speichern» lädst du sie herunter und legst sie in <code>assets/icons/</code> ab.
Automatisch geht es mit <code>node tools/make-icons.mjs</code>.</p>
<div id="out"></div>
<script>
// Gleiche Fuchs-Zeichnung wie in src/render.js (drawFox).
function drawFox(ctx,x,y,face,t,sq){
  const el=(x,y,rx,ry)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()};
  ctx.save();ctx.translate(x,y);ctx.scale(face*(1+sq),1-sq);
  const wag=Math.sin(t*7)*.3;
  ctx.save();ctx.translate(-14,-16);ctx.rotate(-.5+wag);
  ctx.fillStyle='#ff8a2a';el(-13,0,17,9);ctx.fillStyle='#fff';el(-26,0,7,6);ctx.restore();
  ctx.fillStyle='#5a2d0c';el(-7,-3,8,4.5);el(8,-3,8,4.5);
  ctx.fillStyle='#ff8a2a';
  ctx.beginPath();ctx.moveTo(-14,-34);ctx.lineTo(-10,-56);ctx.lineTo(-1,-38);ctx.fill();
  ctx.beginPath();ctx.moveTo(2,-38);ctx.lineTo(10,-57);ctx.lineTo(15,-33);ctx.fill();
  ctx.fillStyle='#5a2d0c';
  ctx.beginPath();ctx.moveTo(-10,-38);ctx.lineTo(-9,-50);ctx.lineTo(-4,-39);ctx.fill();
  ctx.beginPath();ctx.moveTo(5,-39);ctx.lineTo(10,-51);ctx.lineTo(12,-37);ctx.fill();
  ctx.fillStyle='#ff8a2a';el(0,-22,19,21);
  ctx.fillStyle='#fff3e6';el(5,-14,11,10);el(12,-24,9,7);
  ctx.fillStyle='#fff';el(4,-29,5,6);el(13,-29,4.5,6);
  ctx.fillStyle='#2a1a10';el(5.5,-28,2.8,3.8);el(14,-28,2.6,3.8);
  ctx.fillStyle='#fff';el(6.5,-30,1.1,1.3);el(15,-30,1,1.3);
  ctx.fillStyle='#2a1a10';el(20,-23,3,2.4);
  ctx.fillStyle='rgba(255,110,140,.55)';el(-2,-21,4,2.5);
  ctx.strokeStyle='#2a1a10';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(14,-20,3,.2,Math.PI-.4);ctx.stroke();
  ctx.restore();
}
function star(ctx,x,y,r){
  ctx.save();ctx.translate(x,y);ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.5:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  ctx.closePath();ctx.fillStyle='#ffd43b';ctx.fill();ctx.lineWidth=r*.16;ctx.strokeStyle='#e89b00';ctx.lineJoin='round';ctx.stroke();ctx.restore();
}
// Alles Wichtige liegt in den inneren 80 % (sicher für «maskable»-Icons).
function drawIcon(c){
  const s=c.width, ctx=c.getContext('2d'), u=s/100;
  const g=ctx.createLinearGradient(0,0,0,s);g.addColorStop(0,'#6ec3ff');g.addColorStop(1,'#e2f5ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  ctx.fillStyle='#fff1a0';ctx.beginPath();ctx.arc(78*u,22*u,10*u,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6ec65c';ctx.beginPath();ctx.ellipse(50*u,104*u,80*u,34*u,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5cc24a';ctx.fillRect(0,76*u,s,s);
  ctx.fillStyle='#a4682f';ctx.fillRect(0,82*u,s,s);
  star(ctx,26*u,26*u,8*u);
  ctx.save();ctx.translate(50*u,79*u);ctx.scale(u*1.05,u*1.05);drawFox(ctx,0,0,1,0.9,0);ctx.restore();
}
const SIZES=[['icon-180.png',180],['icon-192.png',192],['icon-512.png',512]];
const out=document.getElementById('out');
for(const [name,size] of SIZES){
  const c=document.createElement('canvas');c.width=c.height=size;drawIcon(c);
  const f=document.createElement('figure');const a=document.createElement('a');
  a.href=c.toDataURL('image/png');a.download=name;a.textContent='PNG speichern: '+name;
  f.append(c,document.createElement('br'),a);out.append(f);
}
</script>
</body>
</html>
